name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The project requires Python 3.12 (see README); the signal stack
        # (dt.UTC, py312 typing) does not import on older interpreters.
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pylint
    - name: Analysing the code with pylint
      # Errors-only: ruff owns style (ruff.toml section in pyproject);
      # pylint -E catches real defects (undefined names, bad calls).
      run: |
        pylint -E $(git ls-files '*.py')
