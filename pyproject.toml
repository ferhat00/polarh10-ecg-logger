[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
ignore = [
    "N802",  # Flask config uses UPPER_CASE property names
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:biosppy.*",
]

# CI runs pylint in errors-only mode (pylint -E); ruff owns style locally.
[tool.pylint.main]
py-version = "3.12"
ignore-paths = ["migrations/.*"]

[tool.pylint."messages control"]
# numpy's NpzFile defeats pylint's subscript inference (E1136 false positives).
disable = ["unsubscriptable-object"]
